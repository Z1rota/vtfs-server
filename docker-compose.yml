services:
  postgres:
    image: postgres:17
    container_name: vtfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vtfs
      POSTGRES_USER: vtfs
      POSTGRES_PASSWORD: vtfs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vtfs_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
  vtfs_pgdata:
  redis_data: